[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opportunity-calendar"
version = "0.1.0"
description = "Convert academic opportunity CSV files into ICS calendar files."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "pyyaml>=6.0",
  "requests>=2.0",
]

[project.scripts]
opportunity-calendar = "src.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.coverage.run]
source = ["src", "scripts"]

[tool.coverage.report]
fail_under = 80
show_missing = true

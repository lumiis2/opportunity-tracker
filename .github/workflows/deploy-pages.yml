name: Sync, build and publish calendars

on:
  schedule:
    - cron: '0 6 * * 1'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      sync_status: ${{ steps.sync.outcome }}
      test_status: ${{ steps.tests.outcome }}
      build_status: ${{ steps.build.outcome }}
      report_artifact_id: ${{ steps.report_inputs.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Sync Google Sheets
        id: sync
        run: python scripts/sync_sheets.py

      - name: Run tests
        id: tests
        run: python -m pytest -q

      - name: Build calendars
        id: build
        run: python scripts/build.py

      - name: Prepare Pages files
        run: |
          mkdir -p public/data
          cp -v output/*.ics public/
          cp -v output/*.json public/
          cp -v data/*.csv public/data/

      - name: Commit generated files
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv output/*.ics output/*.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync calendars [ci skip]"
            git push origin HEAD:main
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Upload publishing report inputs
        id: report_inputs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: publishing-report-inputs
          path: |
            data/*.csv
            output/calendars.json
          retention-days: 1
          if-no-files-found: ignore

  deploy:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        if: needs.build.result == 'success'
        uses: actions/deploy-pages@v5

      - name: Checkout publishing report script
        id: report_checkout
        if: always()
        uses: actions/checkout@v4

      - name: Set up Python for report
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore publishing report inputs
        id: restore_report
        if: always() && needs.build.outputs.report_artifact_id != ''
        uses: actions/download-artifact@v8
        with:
          name: publishing-report-inputs
          path: .

      - name: Publishing summary
        if: always()
        env:
          SYNC_STATUS: ${{ needs.build.outputs.sync_status }}
          TEST_STATUS: ${{ needs.build.outputs.test_status }}
          BUILD_STATUS: ${{ needs.build.outputs.build_status }}
          DEPLOY_STATUS: ${{ steps.deploy.outcome }}
          REPORT_STATUS: ${{ steps.restore_report.outcome }}
          REPORT_CHECKOUT_STATUS: ${{ steps.report_checkout.outcome }}
        run: |
          if [ "$REPORT_STATUS" = "success" ] && [ "$REPORT_CHECKOUT_STATUS" = "success" ]; then
            python scripts/publishing_summary.py >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Calendar publishing report"
              echo ""
              echo "Counts unavailable: publishing report inputs could not be restored."
              echo ""
              echo "- Sync: **$SYNC_STATUS**"
              echo "- Tests: **$TEST_STATUS**"
              echo "- Build: **$BUILD_STATUS**"
              echo "- Deploy: **$DEPLOY_STATUS**"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

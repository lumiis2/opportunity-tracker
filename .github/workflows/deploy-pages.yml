name: Sync, build and publish calendars

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest

      - name: Sync Google Sheets
        run: python scripts/sync_sheets.py

      - name: Run tests
        run: python -m pytest -q

      - name: Build calendars
        run: python scripts/build.py

      - name: Prepare Pages files
        run: |
          mkdir -p public/data
          cp -v output/*.ics public/
          cp -v output/*.json public/
          cp -v data/*.csv public/data/

      - name: Commit generated files
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv output/*.ics output/*.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync calendars [ci skip]"
            git push origin HEAD:main
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
